spring.application.name=smart-disaster-backend
server.port=${PORT:8080}

# File-backed H2 persists users and requests across backend restarts without MySQL setup.
spring.datasource.url=jdbc:h2:file:./data/disaster_db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Optional first-admin bootstrap. Set both environment variables to create an admin account.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
